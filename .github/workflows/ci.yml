name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test-debug:
    name: build-and-test (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgtest-dev libgmock-dev python3

      - name: Configure
        run: >
          cmake -S . -B build-ci/Debug
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DEQUINOX_LOGGER_TESTS=ON
          -DEQUINOX_LOGGER_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-ci/Debug --parallel

      - name: Run tests
        working-directory: build-ci/Debug
        run: |
          TEST_BIN=$(find . -type f -name "EquinoxLoggerTests.x86" | head -n 1)
          if [ -z "$TEST_BIN" ]; then
            echo "Test binary not found"
            exit 1
          fi

          chmod +x "$TEST_BIN"
          export LD_LIBRARY_PATH="$PWD:$PWD/tests:${LD_LIBRARY_PATH:-}"
          "$TEST_BIN" --gtest_color=yes

      - name: Run performance benchmark
        env:
          THRESHOLD_PERCENT: 25
        run: |
          git fetch origin main --depth=1 || true
          TEST_BIN="$(find build-ci/Debug -type f -name 'EquinoxLoggerTests.x86' | head -n 1)"
          chmod +x scripts/run_performance_benchmark.sh
          bash scripts/run_performance_benchmark.sh \
            --binary "$TEST_BIN" \
            --output-dir "$GITHUB_WORKSPACE/site" \
            --chart-name "performance-benchmark-Debug.svg" \
            --sink-chart-name "performance-throughput-by-sink-Debug.svg" \
            --history-file "$GITHUB_WORKSPACE/benchmarks/performance-history-Debug.json" \
            --threshold "$THRESHOLD_PERCENT" \
            --build-label "Debug"

      - name: Upload performance charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-chart-debug
          path: |
            site/performance-benchmark-Debug.svg
            site/performance-throughput-by-sink-Debug.svg
          if-no-files-found: error

  build-and-test-release:
    name: build-and-test (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgtest-dev libgmock-dev python3

      - name: Configure
        run: >
          cmake -S . -B build-ci/Release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEQUINOX_LOGGER_TESTS=ON
          -DEQUINOX_LOGGER_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-ci/Release --parallel

      - name: Run tests
        working-directory: build-ci/Release
        run: |
          TEST_BIN=$(find . -type f -name "EquinoxLoggerTests.x86" | head -n 1)
          if [ -z "$TEST_BIN" ]; then
            echo "Test binary not found"
            exit 1
          fi

          chmod +x "$TEST_BIN"
          export LD_LIBRARY_PATH="$PWD:$PWD/tests:${LD_LIBRARY_PATH:-}"
          "$TEST_BIN" --gtest_color=yes

      - name: Run performance benchmark
        env:
          THRESHOLD_PERCENT: 10
        run: |
          git fetch origin main --depth=1 || true
          TEST_BIN="$(find build-ci/Release -type f -name 'EquinoxLoggerTests.x86' | head -n 1)"
          chmod +x scripts/run_performance_benchmark.sh
          bash scripts/run_performance_benchmark.sh \
            --binary "$TEST_BIN" \
            --output-dir "$GITHUB_WORKSPACE/site" \
            --chart-name "performance-benchmark-Release.svg" \
            --sink-chart-name "performance-throughput-by-sink-Release.svg" \
            --history-file "$GITHUB_WORKSPACE/benchmarks/performance-history-Release.json" \
            --threshold "$THRESHOLD_PERCENT" \
            --build-label "Release"

      - name: Upload performance charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-chart-release
          path: |
            site/performance-benchmark-Release.svg
            site/performance-throughput-by-sink-Release.svg
          if-no-files-found: error

  deploy-pages:
    name: Deploy benchmark pages
    needs:
      - build-and-test-debug
      - build-and-test-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Release charts
        uses: actions/download-artifact@v4
        with:
          name: performance-chart-release
          path: site-release

      - name: Download Debug charts
        uses: actions/download-artifact@v4
        with:
          name: performance-chart-debug
          path: site-debug

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p site
          cp -f site-release/performance-benchmark-Release.svg site/
          cp -f site-release/performance-throughput-by-sink-Release.svg site/
          cp -f site-debug/performance-benchmark-Debug.svg site/
          cp -f site-debug/performance-throughput-by-sink-Debug.svg site/
          echo "Benchmark pages assembled in site/"
          ls -l site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
