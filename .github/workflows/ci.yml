          fi

          chmod +x "$TEST_BIN"
          export LD_LIBRARY_PATH="$PWD:$PWD/tests:${LD_LIBRARY_PATH:-}"
          "$TEST_BIN" --gtest_color=yes

      - name: Run performance benchmark
        env:
          THRESHOLD_PERCENT: 10
        run: |
          git fetch origin main --depth=1 || true
          TEST_BIN="$(find build-ci/Release -type f -name 'EquinoxLoggerTests.x86' | head -n 1)"
          chmod +x scripts/run_performance_benchmark.sh
