name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build-and-test-debug:
    name: build-and-test (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgtest-dev libgmock-dev python3

      - name: Configure
        run: >
          cmake -S . -B build-ci/Debug
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DEQUINOX_LOGGER_TESTS=ON
          -DEQUINOX_LOGGER_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-ci/Debug --parallel

      - name: Run tests
        working-directory: build-ci/Debug
        run: |
          TEST_BIN=$(find . -type f -name "EquinoxLoggerTests.x86" | head -n 1)
          if [ -z "$TEST_BIN" ]; then
            echo "Test binary not found"
            exit 1
          fi

          chmod +x "$TEST_BIN"
          export LD_LIBRARY_PATH="$PWD:$PWD/tests:${LD_LIBRARY_PATH:-}"
          "$TEST_BIN" --gtest_color=yes

      - name: Run performance benchmark
        env:
          THRESHOLD_PERCENT: 25
        run: |
          git fetch origin main --depth=1 || true
          TEST_BIN="$(find build-ci/Debug -type f -name 'EquinoxLoggerTests.x86' | head -n 1)"
          chmod +x scripts/run_performance_benchmark.sh
          bash scripts/run_performance_benchmark.sh \
            --binary "$TEST_BIN" \
            --output-dir "$GITHUB_WORKSPACE/docs/images" \
            --chart-name "performance-benchmark-Debug.svg" \
            --sink-chart-name "performance-throughput-by-sink-Debug.svg" \
            --history-file "$GITHUB_WORKSPACE/benchmarks/performance-history-Debug.json" \
            --threshold "$THRESHOLD_PERCENT" \
            --build-label "Debug"

      - name: Upload performance charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-chart-debug
          path: |
            docs/images/performance-benchmark-Debug.svg
            docs/images/performance-throughput-by-sink-Debug.svg
          if-no-files-found: error

      - name: Commit generated performance charts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/images/performance-benchmark-Debug.svg \
            docs/images/performance-throughput-by-sink-Debug.svg \
            benchmarks/performance-history-Debug.json

          if git diff --cached --quiet; then
            echo "No performance artifact changes to commit for Debug build."
          else
            git commit -m "Update Debug performance charts"
            BRANCH="${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${BRANCH}"
          fi

  build-and-test-release:
    name: build-and-test (Release)
    runs-on: ubuntu-latest

    steps:
