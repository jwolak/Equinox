name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgtest-dev libgmock-dev python3

      - name: Configure
        run: >
          cmake -S . -B build-ci/${{ matrix.build_type }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DEQUINOX_LOGGER_TESTS=ON
          -DEQUINOX_LOGGER_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-ci/${{ matrix.build_type }} --parallel

      - name: Run tests
        working-directory: build-ci/${{ matrix.build_type }}
        run: |
          TEST_BIN=$(find . -type f -name "EquinoxLoggerTests.x86" | head -n 1)
          if [ -z "$TEST_BIN" ]; then
            echo "Test binary not found"
            exit 1
          fi

          chmod +x "$TEST_BIN"
          export LD_LIBRARY_PATH="$PWD:$PWD/tests:${LD_LIBRARY_PATH:-}"
          "$TEST_BIN" --gtest_color=yes

      - name: Run performance benchmark
        env:
          THRESHOLD_PERCENT: 10
        run: |
          git fetch origin main --depth=1 || true
          TEST_BIN="$(find build-ci/${{ matrix.build_type }} -type f -name 'EquinoxLoggerTests.x86' | head -n 1)"
          chmod +x scripts/run_performance_benchmark.sh
          bash scripts/run_performance_benchmark.sh \
            --binary "$TEST_BIN" \
            --output-dir "$GITHUB_WORKSPACE/docs/images" \
            --history-file "$GITHUB_WORKSPACE/benchmarks/performance-history.json" \
            --threshold "$THRESHOLD_PERCENT"

      - name: Upload performance chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-chart-${{ matrix.build_type }}
          path: docs/images/performance-benchmark.svg
          if-no-files-found: error
